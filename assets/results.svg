<text x="40" y="300" font-size="12.5" fill="#94A3B8">Claude Opus 5.5. Tokens = every token the agents processed (input, cache, output), summed from their own usage logs.</text>
<text x="40" y="320" font-size="12.5" fill="#94A3B8">Both re-checks caught both new bugs. A re-run on unchanged code costs prodgate 0 tokens.</text>
