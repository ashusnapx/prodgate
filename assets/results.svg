<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
<title id="t">prodgate benchmark results</title>
<desc id="d">First run: distinct real bugs found, plain review 85, prompt alone 84, prodgate 102. Re-check after a 2-file change: tokens 4.37M vs 2.67M; findings to read 94 vs 5.</desc>
<rect width="1200" height="340" rx="24" fill="#0B1020"/><rect x=".75" y=".75" width="1198.5" height="338.5" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
<text x="40" y="54" font-size="22" font-weight="800" fill="#E2E8F0">Benchmark</text>
<text x="182" y="54" font-size="15" fill="#94A3B8">8 apps · 59 seeded bugs · 24 decoys · every unmatched finding settled by a test</text>
<text x="40" y="104" font-size="17" font-weight="700" fill="#E2E8F0">Real bugs found</text>
<text x="40" y="126" font-size="13" fill="#94A3B8">first run · distinct bugs · higher is better</text>
