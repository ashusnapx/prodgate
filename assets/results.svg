<text x="148" y="258" font-size="14" text-anchor="end" fill="#E2E8F0" font-weight="700">prodgate</text>
<path d="M158,240h162.6a4,4 0 0 1 4,4v18a4,4 0 0 1 -4,4h-162.6z" fill="#8B5CF6"/>
